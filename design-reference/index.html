<head>

<title>fireflyx — AI 全栈 + Agent 开发</title>
<link rel="stylesheet" href="styles.css" />
<style>
.home{min-height:calc(100vh - 70px);display:flex;flex-direction:column;position:relative;z-index:1;}
.home-top{padding-top:clamp(40px,7vw,84px);padding-bottom:clamp(28px,4vw,46px);display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;}
.home-top .statement{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.4vw,46px);line-height:1.08;letter-spacing:-0.022em;max-width:18ch;}
.home-top .statement em{font-style:normal;color:var(--accent);}
.home-top .aside{text-align:right;max-width:30ch;}
.home-top .aside p{font-size:15px;line-height:1.55;color:var(--muted);margin-top:10px;}
@media(max-width:680px){.home-top{flex-direction:column;align-items:flex-start;}.home-top .aside{text-align:left;}}

.modlist{border-top:1px solid var(--line-2);margin-bottom:30px;}
.mod{
  display:grid;grid-template-columns:64px 1fr auto 56px;align-items:center;gap:24px;
  padding:clamp(20px,2.6vw,34px) 4px;border-bottom:1px solid var(--line);
  text-decoration:none;color:var(--ink);position:relative;
  transition:opacity .35s ease, padding-left .45s cubic-bezier(.16,1,.3,1);
}
.modlist:hover .mod{opacity:0.32;}
.modlist .mod:hover{opacity:1;padding-left:20px;}
.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .45s cubic-bezier(.16,1,.3,1);}
.modlist .mod:hover::before{width:3px;box-shadow:0 0 6px 0 rgb(147 112 219 / 0.45);}
.mod-no{font-family:var(--display);font-weight:600;font-size:15px;color:var(--faint);transition:color .35s;}
.modlist .mod:hover .mod-no{color:var(--accent-deep);}
.mod-name{font-family:var(--display);font-weight:600;font-size:clamp(34px,5.4vw,68px);line-height:0.96;letter-spacing:-0.028em;display:flex;align-items:baseline;gap:18px;}
.mod-name .mod-en{font-size:0.34em;font-weight:500;color:var(--faint);letter-spacing:-0.01em;transition:color .35s;}
.modlist .mod:hover .mod-name .mod-en{color:var(--accent-deep);}
.mod-desc{font-size:15px;color:var(--muted);text-align:right;max-width:24ch;justify-self:end;}
.mod-arr{justify-self:end;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);transition:all .4s cubic-bezier(.16,1,.3,1);}
.modlist .mod:hover .mod-arr{background:var(--accent);border-color:var(--accent);color:var(--ink);transform:translateX(4px);box-shadow:0 0 8px 0 rgb(147 112 219 / 0.3);}
@media(max-width:760px){
  .mod{grid-template-columns:42px 1fr auto;gap:14px;}
  .mod-desc{display:none;}
}
@media(max-width:520px){.mod-arr{display:none;}.mod{grid-template-columns:38px 1fr;}}
</style>
</head>
